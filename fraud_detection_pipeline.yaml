pipelineInfo:
  description: 'IEEE CIS Fraud Detection: Full MLOps pipeline with conditional deployment'
  name: fraud-detection-pipeline
root:
  dag:
    outputs:
      artifacts:
        model-evaluation-op-eval_metrics:
          artifactSelectors:
          - outputArtifactKey: eval_metrics
            producerSubtask: model-evaluation-op
        model-training-op-metrics:
          artifactSelectors:
          - outputArtifactKey: metrics
            producerSubtask: model-training-op
    tasks:
      conditional-deployment-op:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-conditional-deployment-op
        dependentTasks:
        - model-evaluation-op
        - model-training-op
        inputs:
          artifacts:
            deploy_decision:
              taskOutputArtifact:
                outputArtifactKey: deploy_decision
                producerTask: model-evaluation-op
            eval_metrics:
              taskOutputArtifact:
                outputArtifactKey: eval_metrics
                producerTask: model-evaluation-op
            model_dir:
              taskOutputArtifact:
                outputArtifactKey: model_dir
                producerTask: model-training-op
        retryPolicy:
          backoffDuration: 60s
          backoffFactor: 2.0
          backoffMaxDuration: 3600s
          maxRetryCount: 2
        taskInfo:
          name: conditional-deployment-op
      data-ingestion-op:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-data-ingestion-op
        inputs:
          parameters:
            data_dir:
              componentInputParameter: data_dir
        retryPolicy:
          backoffDuration: 60s
          backoffFactor: 2.0
          backoffMaxDuration: 3600s
          maxRetryCount: 3
        taskInfo:
          name: data-ingestion-op
      data-preprocessing-op:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-data-preprocessing-op
        dependentTasks:
        - data-ingestion-op
        - data-validation-op
        inputs:
          artifacts:
            input_data:
              taskOutputArtifact:
                outputArtifactKey: output_data
                producerTask: data-ingestion-op
        retryPolicy:
          backoffDuration: 30s
          backoffFactor: 2.0
          backoffMaxDuration: 3600s
          maxRetryCount: 2
        taskInfo:
          name: data-preprocessing-op
      data-validation-op:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-data-validation-op
        dependentTasks:
        - data-ingestion-op
        inputs:
          artifacts:
            input_data:
              taskOutputArtifact:
                outputArtifactKey: output_data
                producerTask: data-ingestion-op
        retryPolicy:
          backoffDuration: 30s
          backoffFactor: 2.0
          backoffMaxDuration: 3600s
          maxRetryCount: 2
        taskInfo:
          name: data-validation-op
      feature-engineering-op:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-feature-engineering-op
        dependentTasks:
        - data-preprocessing-op
        inputs:
          artifacts:
            data_dir:
              taskOutputArtifact:
                outputArtifactKey: output_dir
                producerTask: data-preprocessing-op
        retryPolicy:
          backoffDuration: 30s
          backoffFactor: 2.0
          backoffMaxDuration: 3600s
          maxRetryCount: 2
        taskInfo:
          name: feature-engineering-op
      model-evaluation-op:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-model-evaluation-op
        dependentTasks:
        - feature-engineering-op
        - model-training-op
        inputs:
          artifacts:
            data_dir:
              taskOutputArtifact:
                outputArtifactKey: output_dir
                producerTask: feature-engineering-op
            model_dir:
              taskOutputArtifact:
                outputArtifactKey: model_dir
                producerTask: model-training-op
        retryPolicy:
          backoffDuration: 30s
          backoffFactor: 2.0
          backoffMaxDuration: 3600s
          maxRetryCount: 2
        taskInfo:
          name: model-evaluation-op
      model-training-op:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-model-training-op
        dependentTasks:
        - feature-engineering-op
        inputs:
          artifacts:
            data_dir:
              taskOutputArtifact:
                outputArtifactKey: output_dir
                producerTask: feature-engineering-op
          parameters:
            mlflow_uri:
              componentInputParameter: mlflow_uri
        retryPolicy:
          backoffDuration: 120s
          backoffFactor: 2.0
          backoffMaxDuration: 3600s
          maxRetryCount: 1
        taskInfo:
          name: model-training-op
  inputDefinitions:
    parameters:
      data_dir:
        defaultValue: /mnt/data/raw
        isOptional: true
        parameterType: STRING
      mlflow_uri:
        defaultValue: http://mlflow-service.fraud-detection.svc.cluster.local:5000
        isOptional: true
        parameterType: STRING
  outputDefinitions:
    artifacts:
      model-evaluation-op-eval_metrics:
        artifactType:
          schemaTitle: system.Metrics
          schemaVersion: 0.0.1
      model-training-op-metrics:
        artifactType:
          schemaTitle: system.Metrics
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.6.0
